name: solar_icons_plus
description: Solar icon pack for Flutter with native IconData and duotone SVG support across all six official styles.
version: 1.0.0
homepage: https://github.com/ocostalucas/solar_icons_plus
repository: https://github.com/ocostalucas/solar_icons_plus
issue_tracker: https://github.com/ocostalucas/solar_icons_plus/issues
license: MIT
topics:
  - icons
  - solar-icons
  - ui
  - assets

environment:
  sdk: ^3.11.4
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  fonts:
    - family: SolarIconsOutline
      fonts:
        - asset: lib/fonts/SolarIconsOutline.ttf
    - family: SolarIconsBold
      fonts:
        - asset: lib/fonts/SolarIconsBold.ttf
